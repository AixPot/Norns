[package]
name = "norns"
version = "0.6.2"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
chrono = { version = "=0.4.42", features = ["serde"] }
axum = "=0.8.6"
tokio = { version = "=1.48.0", features = ["full"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
argon2 = "=0.5.3"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
uuid = { version = "=1.18.1", features = ["v4"] }
sha2 = "=0.10.9"
tower-http = { version = "=0.6.6", features = ["fs", "set-header"] }

rust-s3 = { version = "=0.38.0", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] }

zip = { version = "=9.0.5", default-features = false }
tempfile = "=3.23.0"

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"
